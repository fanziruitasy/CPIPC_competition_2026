services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: trusted-rag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ../data_runtime/qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
